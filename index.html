<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Maze of Darkness</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: relative; width: 100vw; height: 100vh; height: 100dvh; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: transparent; }
  #gl { background: #000; }
  canvas { touch-action: none; }
  /* phones held upright: ask for landscape */
  #turn { display: none; position: absolute; inset: 0; z-index: 2; background: #0c0d09; color: #e6d9ae;
    font: bold 20px/1.5 monospace; letter-spacing: 2px; text-align: center; align-items: center; justify-content: center; padding: 24px; }
  @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <canvas id="ui" width="1920" height="1080" tabindex="0"></canvas>
  <div id="turn">TURN YOUR PHONE SIDEWAYS<br>TO DESCEND</div>
</div>
<script type="module" src="src/main.js"></script>
<script>document.getElementById("ui").focus();</script>
</body>
</html>
